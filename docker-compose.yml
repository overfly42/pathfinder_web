services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder
      POSTGRES_DB: pathfinder
    ports:
      - "5432:5432"
    volumes:
      - pathfinder-db-data:/var/lib/postgresql/data

volumes:
  pathfinder-db-data:
